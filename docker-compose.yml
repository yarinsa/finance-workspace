# Local infra: the transactions database and the Temporal dev server.
# The sync worker stays on the Mac (it needs Chrome over CDP, osascript, aws).
# Values come from .env via ${...} interpolation only. Never add `env_file: .env`:
# it would copy the bank credentials into the containers.
#
#   docker compose up -d --wait
name: finance

services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  temporal:
    image: temporalio/temporal:1.4.1   # closest published image to the 1.3.0 CLI it replaces
    restart: unless-stopped
    command: [server, start-dev, --ip, 0.0.0.0, --port, "7233",
              --ui-port, "8233", --db-filename, /data/finance.db]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["${HOME}/.temporal:/data"]   # keeps the existing schedule + run history

volumes:
  pgdata:
