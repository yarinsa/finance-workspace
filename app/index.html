<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- crossorigin="use-credentials": the site sits behind cookie auth, and a manifest
         fetched without credentials would be bounced to the Cognito login. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="תמונת מצב" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef4f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
    <title>תמונת מצב פיננסית</title>
    <script>
      // Follow the OS theme: light by default, `.dark` when the phone is in dark mode.
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () { document.documentElement.classList.toggle("dark", mq.matches); };
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
