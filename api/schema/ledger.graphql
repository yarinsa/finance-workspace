# The ledger: transactions and what they point at (merchant, category, tags, audit).
# Backed by the Postgres `transactions` view (scraped layer + overrides), bound to
# finance.models.LedgerTransaction. See api/schema_bindings.py.

enum Direction {
  """Money out (amount < 0)."""
  EXPENSE
  """Money in: salary, refunds, transfers in (amount > 0)."""
  INCOME
}

"""A horizon's stable code (the `horizons` table's `key`)."""
enum HorizonKey {
  CURRENT
  NEAR
  FUTURE
}

"""How an expense behaves (finance/categories.py)."""
enum ExpenseKind {
  """קבוע: the same or almost the same amount on a schedule (rent, loans, subscriptions)."""
  FIXED
  """משתנה: needed but usage-driven, so estimated (fuel, groceries, electricity)."""
  VARIABLE
}

"""What decided an expense's kind, strongest first."""
enum KindSource {
  """Set on this transaction by hand."""
  MANUAL
  """A merchant rule set by hand."""
  RULE
  """A merchant default in finance/categories.py."""
  MERCHANT
  """The same merchant and amount on about the same day in 3+ months."""
  RECURRING
  """The merchant recurs but this charge is not the recurring one: variable."""
  ONE_OFF
  """RiseUp keeps it in a fixed budget envelope."""
  RISEUP
  """The category's default kind."""
  CATEGORY
}

enum TransactionOrder {
  DATE_DESC
  DATE_ASC
  AMOUNT_DESC
  AMOUNT_ASC
}

"""
One deduplicated ledger row. Its key is (date, absAmount): copies of the same money
in several sources (a card charge and its RiseUp copy) collapse into one transaction.
Fields show the effective value: a manual override if there is one, else the raw value.
"""
type Transaction implements Node {
  id: ID!
  date: Date!
  amount: Money!
  absAmount: Money!
  direction: Direction!
  description: String!
  """Derived from the description (data/spending.py `merchant_name`)."""
  merchant: Merchant!
  category: Category
  """Fixed or variable; null for anything that is not spending (income, transfers, card bills, savings)."""
  kind: ExpenseKind
  kindSource: KindSource
  tags(first: Int, after: String): TagConnection!
  note: String
  excluded: Boolean!
  overridden: Boolean!
  horizon: Horizon
  """The savings goal this transaction is assigned to, by hand."""
  goal: Goal
  """Best-effort source of the row (cal, amex, discount, leumi, …)."""
  origin: String
  sources: [String!]!
  accountId: String
  cardLast4: String
  isCardBillPayment: Boolean!
  isInternalTransfer: Boolean!
  isSavings: Boolean!
  """One leg of a PayBox load and its cash-out: our own money going around (also an internal transfer)."""
  isRoundTrip: Boolean!
  """
  קיזוז links: on an expense, the paybacks netted against it; on a payback, the
  expenses it pays back. Manual links win over the digest's automatic ones.
  """
  offsets: [Offset!]!
  """₪ netted out of this row by its offsets (positive; 0 without any)."""
  offsetAmount: Money!
  """`amount` with offsets netted out: what spending and income figures count."""
  netAmount: Money!
  """A payback whose offsets the user set by hand (possibly none); false = automatic."""
  offsetsManual: Boolean!
  """For an expense: paybacks that could offset it, same merchant first then nearest date. Empty for income."""
  offsetCandidates(first: Int, after: String): TransactionConnection!
  """The values as scraped, before any manual override."""
  raw: RawTransactionValues!
  auditLog(first: Int, after: String): AuditEntryConnection!
}

enum OffsetKind {
  """A same-merchant card refund, matched by the digest."""
  REFUND
  """A household rule (data/offsets/rules.json), e.g. a roommate's share of the rent."""
  RULE
  """Linked by hand."""
  MANUAL
}

"""One קיזוז link, seen from either side."""
type Offset {
  """The other row: the expense, seen from a payback; the payback, seen from an expense."""
  transaction: Transaction!
  """₪ netted out (positive)."""
  amount: Money!
  kind: OffsetKind!
}

type RawTransactionValues {
  category: Category
  horizon: Horizon
}

type TransactionEdge {
  node: Transaction!
  cursor: String!
}

type TransactionConnection {
  edges: [TransactionEdge!]!
  pageInfo: PageInfo!
  """Rows matching the filter, across all pages."""
  totalCount: Int!
  """Sum of `amount` over the rows matching the filter, across all pages."""
  sum: Money!
}

input TransactionFilter {
  direction: Direction
  dateRange: DateRange
  categoryIds: [ID!]
  tagIds: [ID!]
  merchantId: ID
  horizonIds: [ID!]
  goalIds: [ID!]
  """Substring match on the description."""
  search: String
  """Rows marked excluded are hidden unless this is true."""
  includeExcluded: Boolean = false
  """Card-bill payments and moves between our own accounts are hidden unless this is true."""
  includeTransfers: Boolean = false
}

"""
Count and signed sum of a set of transactions. Every edge into a Merchant, Category or
Tag carries one, scoped to the edge: under `Query.categories` it covers the whole
category, under `Merchant.categories` only that merchant's rows in the category.
Excluded rows and transfers are left out, as in `TransactionFilter`'s defaults.
"""
type TransactionTotals {
  count: Int!
  sum: Money!
}

"""How to order a connection of grouped transactions (merchants, categories, tags)."""
enum GroupOrder {
  """By name; horizons in their fixed order (current, near, future)."""
  NAME_ASC
  COUNT_DESC
  """Largest absolute sum first: the biggest spend or income."""
  TOTAL_DESC
  TOTAL_ASC
}

"""A counterparty, derived from transaction descriptions. Not stored."""
type Merchant implements Node {
  id: ID!
  name: String!
  transactions(first: Int, after: String, last: Int, before: String,
               filter: TransactionFilter, orderBy: TransactionOrder = DATE_DESC): TransactionConnection!
  """The categories this merchant's transactions fall in; edge totals are this merchant's share."""
  categories(first: Int, after: String, last: Int, before: String,
             dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): CategoryConnection!
  """The tags on this merchant's transactions; edge totals are this merchant's share."""
  tags(first: Int, after: String, last: Int, before: String,
       dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): TagConnection!
  """The horizons of this merchant's transactions; edge totals are this merchant's share."""
  horizons(first: Int, after: String, last: Int, before: String,
           dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): HorizonConnection!
  """The goals of this merchant's transactions; edge totals are this merchant's share."""
  goals(first: Int, after: String, last: Int, before: String,
        dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): GoalConnection!
}

type MerchantEdge {
  node: Merchant!
  cursor: String!
  totals: TransactionTotals!
}

type MerchantConnection {
  edges: [MerchantEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type Category implements Node {
  id: ID!
  name: String!
  """Where the category came from: BUILTIN (finance/categories.py), RISEUP (a source label not
  mapped yet) or USER (first assigned by hand)."""
  source: CategorySource!
  """The group it sits under (דיור, תחבורה, ...); null when not in the taxonomy."""
  group: String
  """The default kind of its expenses; null for a non-spending category (salary, savings)."""
  kind: ExpenseKind
  """Its amounts follow usage (electricity, fuel, food): never fixed unless set by hand."""
  usageBased: Boolean!
  """The category it was merged into (`categoryMerge`): its transactions count there. Null
  when it stands on its own."""
  mergedInto: Category
  transactions(first: Int, after: String, last: Int, before: String,
               filter: TransactionFilter, orderBy: TransactionOrder = DATE_DESC): TransactionConnection!
  """The merchants in this category; edge totals are each merchant's share."""
  merchants(first: Int, after: String, last: Int, before: String, search: String,
            dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): MerchantConnection!
  """The tags on this category's transactions; edge totals are the category's share."""
  tags(first: Int, after: String, last: Int, before: String,
       dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): TagConnection!
  """The horizons of the category's transactions; edge totals are the category's share."""
  horizons(first: Int, after: String, last: Int, before: String,
           dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): HorizonConnection!
  """The goals of the category's transactions; edge totals are the category's share."""
  goals(first: Int, after: String, last: Int, before: String,
        dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): GoalConnection!
}

enum CategorySource {
  BUILTIN
  RISEUP
  USER
}

type CategoryEdge {
  node: Category!
  cursor: String!
  totals: TransactionTotals!
}

type CategoryConnection {
  edges: [CategoryEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""A free-form label; a transaction can carry several."""
type Tag implements Node {
  id: ID!
  name: String!
  """"#rrggbb", or null for the default color."""
  color: String
  transactions(first: Int, after: String, last: Int, before: String,
               filter: TransactionFilter, orderBy: TransactionOrder = DATE_DESC): TransactionConnection!
  """The merchants of this tag's transactions; edge totals are the tag's share."""
  merchants(first: Int, after: String, last: Int, before: String, search: String,
            dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): MerchantConnection!
  """The categories of this tag's transactions; edge totals are the tag's share."""
  categories(first: Int, after: String, last: Int, before: String,
             dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): CategoryConnection!
  """The horizons of the tag's transactions; edge totals are the tag's share."""
  horizons(first: Int, after: String, last: Int, before: String,
           dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): HorizonConnection!
  """The goals of the tag's transactions; edge totals are the tag's share."""
  goals(first: Int, after: String, last: Int, before: String,
        dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): GoalConnection!
}

type TagEdge {
  node: Tag!
  cursor: String!
  totals: TransactionTotals!
  """When the tag was put on the transaction. Set only under `Transaction.tags`."""
  taggedAt: DateTime
}

type TagConnection {
  edges: [TagEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""
Who a shekel out is for: current me, near-future me, future me (data/horizons.py).
A fixed list; `targetPct` is the share of net income aimed at it.
"""
type Horizon implements Node {
  id: ID!
  key: HorizonKey!
  name: String!
  targetPct: Float!
  position: Int!
  transactions(first: Int, after: String, last: Int, before: String,
               filter: TransactionFilter, orderBy: TransactionOrder = DATE_DESC): TransactionConnection!
  """The goals assigned to this horizon; edge totals are each goal's transactions."""
  goals(first: Int, after: String, last: Int, before: String,
        dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): GoalConnection!
  """The merchants of this horizon's transactions; edge totals are the horizon's share."""
  merchants(first: Int, after: String, last: Int, before: String,
            dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): MerchantConnection!
  """The categories of this horizon's transactions; edge totals are the horizon's share."""
  categories(first: Int, after: String, last: Int, before: String,
             dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): CategoryConnection!
  """The tags of this horizon's transactions; edge totals are the horizon's share."""
  tags(first: Int, after: String, last: Int, before: String,
       dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): TagConnection!
}

type HorizonEdge {
  node: Horizon!
  cursor: String!
  totals: TransactionTotals!
}

type HorizonConnection {
  edges: [HorizonEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

enum GoalInterval {
  MONTHLY
  YEARLY
}

"""A personal savings goal (docs/plangram-prd/04-goals.md); transactions are assigned to it by hand."""
type Goal implements Node {
  id: ID!
  """The goal's stable string id from the old JSON store."""
  slug: String!
  description: String!
  amount: Money!
  startDate: Date
  endDate: Date
  interval: GoalInterval
  repetitions: Int!
  """Yearly increase of `amount`."""
  rise: Money!
  fromAssetId: String
  horizon: Horizon
  transactions(first: Int, after: String, last: Int, before: String,
               filter: TransactionFilter, orderBy: TransactionOrder = DATE_DESC): TransactionConnection!
  """The merchants of this goal's transactions; edge totals are the goal's share."""
  merchants(first: Int, after: String, last: Int, before: String,
            dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): MerchantConnection!
  """The categories of this goal's transactions; edge totals are the goal's share."""
  categories(first: Int, after: String, last: Int, before: String,
             dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): CategoryConnection!
  """The tags of this goal's transactions; edge totals are the goal's share."""
  tags(first: Int, after: String, last: Int, before: String,
       dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): TagConnection!
}

type GoalEdge {
  node: Goal!
  cursor: String!
  totals: TransactionTotals!
}

type GoalConnection {
  edges: [GoalEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""One field change on a transaction's override."""
type AuditEntry {
  at: DateTime!
  actor: String!
  field: String
  old: JSON
  new: JSON
}

type AuditEntryEdge {
  node: AuditEntry!
  cursor: String!
}

type AuditEntryConnection {
  edges: [AuditEntryEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}
