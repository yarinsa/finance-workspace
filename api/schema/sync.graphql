# Scheduled sync (sync/): each scraped source's latest run, from Postgres `sync_status`, which the
# worker writes. Live progress still arrives over SSE (`/api/sync/events`); this is the
# GraphQL view of the same row plus the one thing the app can ask of a failed run: retry it.

"""Where a retry continues: scrape the source again, or straight to digest + publish."""
enum SyncRetryPoint {
  """The scrape or its validation failed: run the source again (a live session needs no new login)."""
  SCRAPE
  """The dump is on disk and validated; only digest and publish failed."""
  DIGEST
}

"""One scraped source's latest sync run."""
type SyncSource implements Node {
  id: ID!
  """The source id, e.g. "harel"."""
  source: String!
  """checking_session … done, or needs_login / failed / rejected."""
  status: String!
  message: String
  """The last step the run reached (1-5), kept on a failure."""
  step: Int
  totalSteps: Int
  error: String
  startedAt: DateTime
  updatedAt: DateTime
  """Where `syncSourceRetry` would continue; null when the last run did not fail."""
  retryFrom: SyncRetryPoint
}

type SyncSourceConnection {
  edges: [SyncSourceEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SyncSourceEdge {
  cursor: String!
  node: SyncSource!
}

type SyncSourcePayload {
  success: Boolean!
  syncSource: SyncSource
}

"""
One connection field of a source (its manifest `connection` property) and whether the household's
vault holds a value for it. Never carries the value: a secret can be replaced, not read back.
"""
type SyncSourceSecret {
  """The variable name, e.g. "CAL_PASSWORD" (the manifest's `x-env`)."""
  name: String!
  title: String!
  """True for a password-like field: the form masks it."""
  masked: Boolean!
  isSet: Boolean!
  """When the vault last changed it; null while it is not set."""
  updatedAt: DateTime
}

"""A source's connection fields as the household's vault holds them."""
type SyncSourceSecrets {
  source: String!
  """
  False when this household is not on the vault with a write identity (it keeps its `.env`, set
  on the Mac): the fields are then listed without a state and cannot be set from the app.
  """
  canEdit: Boolean!
  fields: [SyncSourceSecret!]!
}

input SyncSourceSecretSetInput {
  """The source id, e.g. "cal"."""
  source: String!
  """One of the source's connection variables; any other name is refused."""
  name: String!
  """Stored in the household's vault and never echoed, logged or kept by the API."""
  value: String!
}

type SyncSourceSecretsPayload {
  success: Boolean!
  secrets: SyncSourceSecrets
}
