# The headline position, as the last digest stored it (accounts, credit_cards, loans,
# savings_holdings). Each entity type is bound to its row class in finance/tables.py; the
# totals are computed from those rows (finance/views/snapshot.py). As-of time: Query.dataAsOf.

type Snapshot {
  totals: SnapshotTotals!
  bankAccounts: [BankAccount!]!
  creditCards: [CreditCard!]!
  loans: [Loan!]!
  """Long-term savings: assets, never cashflow."""
  savings: [Savings!]!
}

type SnapshotTotals {
  bankBalancesSum: Money!
  creditCardDebt: Money!
  mortgageBalance: Money!
  consumerLoanBalance: Money!
  totalDebt: Money!
  """Liquid position vs debt; excludes savings."""
  trackedNetPosition: Money!
  longTermSavings: Money!
  liquidSavings: Money!
  illiquidSavings: Money!
  """What we are worth: tracked net position plus savings."""
  netPositionWithSavings: Money!
  """The apartment's hand-typed value (Query.assets); null until one is entered."""
  propertyValue: Money
  """Net position with savings plus the property; null without a property value."""
  netWorthWithProperty: Money
  monthlyLoanService: Money!
}

type BankAccount {
  institution: String!
  accountId: String!
  kind: String!
  label: String
  balance: Money!
  availableBalance: Money
  overdraftLimit: Money
}

type CreditCard {
  issuer: String!
  last4: String!
  name: String
  holder: String
  active: Boolean
  """The issuer's next charge (RiseUp's figure for a card no direct source sees)."""
  owed: Money!
  """The day that charge leaves the bank; null when only RiseUp knows the card."""
  nextChargeDate: Date
}

type Loan {
  lender: String!
  loanId: String
  name: String
  category: String!
  balance: Money!
  originalAmount: Money
  ratePct: Float
  rateType: String
  indexLinked: Boolean
  paymentsRemaining: Int
  paymentsTotal: Int
  monthlyPayment: Money
  finalDate: Date
  """The installment `monthlyPayment` is due on (the mortgage dump's next payment)."""
  nextPaymentDate: Date
}

type Savings {
  """`institution:topic_id`, else the label: the id `holdingAssign` takes."""
  holdingId: String!
  institution: String!
  kind: String!
  label: String
  balance: Money!
  liquid: Boolean
  liquidityDate: Date
  maturityDate: Date
  asOf: Date
  managementFee: Float
  yieldYtd: Float
  """Where the user placed it by hand (`holdingAssign`); null = derived from the liquidity date."""
  assignment: HoldingAssignment
}
