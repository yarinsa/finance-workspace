"""About one transaction, e.g. a payback that could offset an expense (קיזוז)."""
type TransactionNotification implements Notification & Node {
  id: ID!
  type: String!
  category: NotificationCategory!
  severity: NotificationSeverity!
  title: String!
  detail: String
  amount: Money
  cta: NotificationAction
  createdAt: DateTime!
  updatedAt: DateTime!
  readAt: DateTime
  snoozedUntilAt: DateTime
  archivedAt: DateTime
  resolvedAt: DateTime
  transaction: Transaction
}

"""Anything without a more specific subject."""
type GenericNotification implements Notification & Node {
  id: ID!
  type: String!
  category: NotificationCategory!
  severity: NotificationSeverity!
  title: String!
  detail: String
  amount: Money
  cta: NotificationAction
  createdAt: DateTime!
  updatedAt: DateTime!
  readAt: DateTime
  snoozedUntilAt: DateTime
  archivedAt: DateTime
  resolvedAt: DateTime
}

input NotificationFilter {
  category: [NotificationCategory!]
  """true: only unread; false: only read."""
  unread: Boolean
  includeArchived: Boolean = false
  includeResolved: Boolean = false
  """Also list items whose snooze has not run out."""
  includeSnoozed: Boolean = false
}

type NotificationConnection {
  edges: [NotificationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type NotificationEdge {
  cursor: String!
  node: Notification!
}

input UpdateNotificationInput {
  clientMutationId: String
  id: ID!
  read: Boolean
  snoozedUntilAt: DateTime
}

input NotificationIdInput {
  clientMutationId: String
  id: ID!
}

input BulkNotificationInput {
  clientMutationId: String
  category: [NotificationCategory!]
}

input SnoozeAllNotificationsInput {
  clientMutationId: String
  snoozedUntilAt: DateTime!
  category: [NotificationCategory!]
}

type NotificationPayload {
  clientMutationId: String
  notification: Notification!
}

type BulkNotificationPayload {
  clientMutationId: String
  count: Int!
}
