  category: NotificationCategory!
  severity: NotificationSeverity!
  title: String!
  detail: String
  amount: Money
  cta: NotificationAction
  createdAt: DateTime!
  updatedAt: DateTime!
  readAt: DateTime
  snoozedUntilAt: DateTime
  archivedAt: DateTime
  resolvedAt: DateTime
  services: [String!]!
}

"""Data sources that need attention: a rejected dump, a stale sync."""
type SyncNotification implements Notification & Node {
  id: ID!
  type: String!
  category: NotificationCategory!
  severity: NotificationSeverity!
  title: String!
  detail: String
  amount: Money
  cta: NotificationAction
  createdAt: DateTime!
  updatedAt: DateTime!
  readAt: DateTime
  snoozedUntilAt: DateTime
  archivedAt: DateTime
  resolvedAt: DateTime
  sources: [String!]!
