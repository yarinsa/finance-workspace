type Query {
  node(id: ID!): Node
  """
  A transaction by its ledger key, for screens that only know the date and amount
  from the static JSON. Null when no transaction has this key.
  """
  transactionByKey(date: Date!, absAmount: Money!): Transaction

  transactions(first: Int, after: String, last: Int, before: String,
               filter: TransactionFilter, orderBy: TransactionOrder = DATE_DESC): TransactionConnection!
  """`transactions` with `filter.direction = EXPENSE`."""
  expenses(first: Int, after: String, last: Int, before: String,
           filter: TransactionFilter, orderBy: TransactionOrder = DATE_DESC): TransactionConnection!
  """`transactions` with `filter.direction = INCOME`."""
  incomes(first: Int, after: String, last: Int, before: String,
          filter: TransactionFilter, orderBy: TransactionOrder = DATE_DESC): TransactionConnection!

  """Edge totals cover each merchant's transactions in `dateRange` (all time if omitted)."""
  merchants(first: Int, after: String, last: Int, before: String, search: String,
            dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): MerchantConnection!
  categories(first: Int, after: String, last: Int, before: String, search: String,
             dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): CategoryConnection!
  tags(first: Int, after: String, last: Int, before: String, search: String,
       dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): TagConnection!
  horizons(first: Int, after: String, last: Int, before: String, search: String,
           dateRange: DateRange, orderBy: GroupOrder = NAME_ASC): HorizonConnection!
  goals(first: Int, after: String, last: Int, before: String, search: String,
        dateRange: DateRange, orderBy: GroupOrder = NAME_ASC): GoalConnection!

  snapshot: Snapshot!

  """The Goals screen's three general targets; a null amount is unset."""
  planTargets: PlanTargets!

  """Every tenant with its members (tenants.graphql). Platform admins only."""
  tenants: [Tenant!]!

  """Assets no scraper sees (assets.graphql), oldest first."""
  assets(first: Int, after: String, last: Int, before: String): AssetConnection!

  """Every scraped source's latest sync run (sync.graphql), by source id."""
  syncSources(first: Int, after: String, last: Int, before: String): SyncSourceConnection!
  """A source's connection fields and which of them the household's vault holds (never the values)."""
  syncSourceSecrets(source: String!): SyncSourceSecrets!

  # inbox (inbox.graphql)
  """Most severe first, then most recently updated."""
  notifications(first: Int, after: String, last: Int, before: String,
                filter: NotificationFilter): NotificationConnection!
  """Unread notifications among the visible ones, optionally within some categories."""
  notificationsUnreadCount(category: [NotificationCategory!]): Int!
}

# Mutation conventions. New mutations follow the Linear style: `entityVerb` names, the target's
# `id` as its own argument, one `input`, and a `{success, entity}` payload (`DeletePayload` for
# deletes). The older mutations are Relay-style (one `input` carrying the id, `clientMutationId`
# echoed back) and are pending migration. Either way a failure is a GraphQL error, every mutation
# needs the CSRF headers and signals a ledger rebuild on success, except the inbox's
# (inbox.graphql), which change no ledger data.

type Mutation {
  """Set any of the override fields; a null field clears that override."""
  updateTransaction(input: UpdateTransactionInput!): UpdateTransactionPayload!
  """Drop every override on a transaction, back to its raw values."""
  clearTransactionOverride(input: ClearTransactionOverrideInput!): ClearTransactionOverridePayload!
  """Replace the full set of tags on a transaction; unknown names are created."""
  setTransactionTags(input: SetTransactionTagsInput!): SetTransactionTagsPayload!
  """
  Net (part of) a payback against an expense (קיזוז). The payback's offsets become
  manual: its current links are kept and this one is added or its amount replaced.
  """
  linkOffset(input: LinkOffsetInput!): OffsetPayload!
  """Remove one link; the payback stays manual (with no links it offsets nothing)."""
  unlinkOffset(input: UnlinkOffsetInput!): OffsetPayload!
  """Drop the manual decision on a payback: the digest's automatic offsets apply again."""
  resetOffsets(input: ResetOffsetsInput!): ResetOffsetsPayload!
  updateTag(input: UpdateTagInput!): UpdateTagPayload!
  deleteTag(input: DeleteTagInput!): DeleteTagPayload!

  # Linear style
  goalCreate(input: GoalCreateInput!): GoalPayload!
  goalUpdate(id: ID!, input: GoalUpdateInput!): GoalPayload!
  """Delete a goal; transactions assigned to it are unassigned."""
  goalDelete(id: ID!): DeletePayload!
  """Set any of the general targets; null or 0 unsets one, an omitted one is untouched."""
  planTargetsUpdate(input: PlanTargetsUpdateInput!): PlanTargetsPayload!
  """
  Place a savings holding by hand: the horizon and/or goal it belongs to (holding_assignments).
  A null clears a field, an omitted one is untouched; a holding left with neither is forgotten
  and falls back to the horizon derived from its liquidity date.
  """
  holdingAssign(input: HoldingAssignInput!): HoldingAssignPayload!

  """
  Merge a category into another: its transactions count as the target's (its plan adds to
  the target's) until `categoryUnmerge`. Categories merged into it move along; the target
  may not itself be merged.
  """
  categoryMerge(id: ID!, input: CategoryMergeInput!): CategoryPayload!
  """Undo a merge: the category stands on its own again."""
  categoryUnmerge(id: ID!): CategoryPayload!

  # tenants (tenants.graphql): platform admins only, no ledger rebuild
  tenantCreate(input: TenantCreateInput!): TenantPayload!
  tenantMemberSet(id: ID!, input: TenantMemberSetInput!): TenantPayload!
  tenantMemberRemove(id: ID!, input: TenantMemberRemoveInput!): TenantPayload!
  tenantSetStatus(id: ID!, input: TenantSetStatusInput!): TenantPayload!
  """
  Provision or deprovision `email` in Cognito from what the database says: a member of an active
  tenant gets an account (Cognito emails the invitation when it is new) and the tenant's group;
  anyone else is taken out of the group, and an account with no access left anywhere is disabled
  (reversible). The API holds no AWS credentials, so the Mac's sync worker runs it (the app waits up
  to ~40 s). Until it has run, a new member cannot sign in or see the tenant's files.
  """
  tenantAccessSync(id: ID!, input: TenantAccessSyncInput!): TenantAccessPayload!

  # assets (assets.graphql)
  assetCreate(input: AssetCreateInput!): AssetPayload!
  assetUpdate(id: ID!, input: AssetUpdateInput!): AssetPayload!

  # sync (sync.graphql): no ledger rebuild
  """
  Retry a failed or rejected source from where it stopped (`retryFrom`): a one-source sync on
  the Mac. An error when the last run did not fail or the sync worker is not reachable.
  """
  syncSourceRetry(id: ID!): SyncSourcePayload!
  """
  Store one connection secret in the household's vault (create or replace). The API writes it
  straight through and keeps nothing; an error when the household has no vault write identity
  or the name is not one of the source's connection variables. Takes effect on the next sync.
  """
  syncSourceSecretSet(input: SyncSourceSecretSetInput!): SyncSourceSecretsPayload!

  # inbox (inbox.graphql): no ledger rebuild
  """Mark read or unread, and/or snooze (or clear the snooze with a null). Snoozing marks it unread."""
  updateNotification(input: UpdateNotificationInput!): NotificationPayload!
  archiveNotification(input: NotificationIdInput!): NotificationPayload!
  unarchiveNotification(input: NotificationIdInput!): NotificationPayload!
  """Over the visible notifications (in `category`, if given); returns how many changed."""
  markAllNotificationsRead(input: BulkNotificationInput!): BulkNotificationPayload!
  archiveAllNotifications(input: BulkNotificationInput!): BulkNotificationPayload!
  snoozeAllNotifications(input: SnoozeAllNotificationsInput!): BulkNotificationPayload!
}

input UpdateTransactionInput {
  clientMutationId: String
  id: ID!
  """Category name; a new name is added as a USER category."""
  category: String
  note: String
  excluded: Boolean
  horizon: HorizonKey
  """A Goal id; null unassigns."""
  goalId: ID
}

type UpdateTransactionPayload {
  clientMutationId: String
  transaction: Transaction!
}

input ClearTransactionOverrideInput {
  clientMutationId: String
  id: ID!
}

type ClearTransactionOverridePayload {
  clientMutationId: String
  transaction: Transaction!
}

input SetTransactionTagsInput {
  clientMutationId: String
  id: ID!
  tags: [String!]!
}

type SetTransactionTagsPayload {
  clientMutationId: String
  transaction: Transaction!
}

input LinkOffsetInput {
  clientMutationId: String
  """Money in (an INCOME transaction)."""
  paybackId: ID!
  """Money out (an EXPENSE transaction)."""
  expenseId: ID!
  """₪ to net; default: as much as both rows have left."""
  amount: Money
}

input UnlinkOffsetInput {
  clientMutationId: String
  paybackId: ID!
  expenseId: ID!
}

type OffsetPayload {
  clientMutationId: String
  payback: Transaction!
  expense: Transaction!
}

input ResetOffsetsInput {
  clientMutationId: String
  paybackId: ID!
}

type ResetOffsetsPayload {
  clientMutationId: String
  payback: Transaction!
}

input UpdateTagInput {
  clientMutationId: String
  id: ID!
  name: String
  """"#rrggbb"; null clears it."""
  color: String
}

type UpdateTagPayload {
  clientMutationId: String
  tag: Tag!
}

input DeleteTagInput {
  clientMutationId: String
  id: ID!
}

type DeleteTagPayload {
  clientMutationId: String
  deletedTagId: ID!
}

input GoalCreateInput {
  description: String!
  amount: Money!
  startDate: Date
  endDate: Date
  interval: GoalInterval
  repetitions: Int
  rise: Money
  horizon: HorizonKey
}

"""Any of the goal's fields; a null clears it (description and amount cannot be cleared)."""
input GoalUpdateInput {
  description: String
  amount: Money
  startDate: Date
  endDate: Date
  interval: GoalInterval
  repetitions: Int
  rise: Money
  horizon: HorizonKey
}

type GoalPayload {
  success: Boolean!
  goal: Goal
}

"""Result of a delete; `entityId` is the deleted node's global id."""
input CategoryMergeInput {
  """The Category to merge into."""
  intoId: ID!
}

type CategoryPayload {
  success: Boolean!
  category: Category
}

type DeletePayload {
  success: Boolean!
  entityId: ID!
}

"""The emergency-fund, inheritance and retirement targets (data/goals.py); null = not set."""
type PlanTargets {
  emergencyFund: Money
  inheritance: Money
  retirement: Money
}

"""At least one field; a negative amount is an error, null or 0 unsets."""
input PlanTargetsUpdateInput {
  emergencyFund: Money
  inheritance: Money
  retirement: Money
}

type PlanTargetsPayload {
  success: Boolean!
  planTargets: PlanTargets!
}

"""Where the user placed a savings holding. `holdingId` is `institution:topic_id` (the app's id)."""
type HoldingAssignment {
  holdingId: String!
  horizon: HorizonKey
  goalId: ID
}

"""`holdingId` plus at least one of horizon / goalId; null clears that field."""
input HoldingAssignInput {
  holdingId: String!
  horizon: HorizonKey
  goalId: ID
}

type HoldingAssignPayload {
  success: Boolean!
  """Null once both fields are cleared."""
  assignment: HoldingAssignment
}
