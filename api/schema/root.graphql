type Query {
  node(id: ID!): Node
  """
  A transaction by its ledger key, for screens that only know the date and amount
  from the static JSON. Null when no transaction has this key.
  """
  transactionByKey(date: Date!, absAmount: Money!): Transaction

  transactions(first: Int, after: String, last: Int, before: String,
               filter: TransactionFilter, orderBy: TransactionOrder = DATE_DESC): TransactionConnection!
  """`transactions` with `filter.direction = EXPENSE`."""
  expenses(first: Int, after: String, last: Int, before: String,
           filter: TransactionFilter, orderBy: TransactionOrder = DATE_DESC): TransactionConnection!
  """`transactions` with `filter.direction = INCOME`."""
  incomes(first: Int, after: String, last: Int, before: String,
          filter: TransactionFilter, orderBy: TransactionOrder = DATE_DESC): TransactionConnection!

  """Edge totals cover each merchant's transactions in `dateRange` (all time if omitted)."""
  merchants(first: Int, after: String, last: Int, before: String, search: String,
            dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): MerchantConnection!
  categories(first: Int, after: String, last: Int, before: String, search: String,
             dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): CategoryConnection!
  tags(first: Int, after: String, last: Int, before: String, search: String,
       dateRange: DateRange, orderBy: GroupOrder = TOTAL_DESC): TagConnection!
  horizons(first: Int, after: String, last: Int, before: String, search: String,
           dateRange: DateRange, orderBy: GroupOrder = NAME_ASC): HorizonConnection!
  goals(first: Int, after: String, last: Int, before: String, search: String,
        dateRange: DateRange, orderBy: GroupOrder = NAME_ASC): GoalConnection!

  snapshot: Snapshot!
}

# Relay mutation convention: one `input`, one payload, `clientMutationId` echoed back.
# Every mutation needs the CSRF headers and signals a ledger rebuild on success.

type Mutation {
  """Set any of the override fields; a null field clears that override."""
  updateTransaction(input: UpdateTransactionInput!): UpdateTransactionPayload!
  """Drop every override on a transaction, back to its raw values."""
  clearTransactionOverride(input: ClearTransactionOverrideInput!): ClearTransactionOverridePayload!
  """Replace the full set of tags on a transaction; unknown names are created."""
  setTransactionTags(input: SetTransactionTagsInput!): SetTransactionTagsPayload!
  updateTag(input: UpdateTagInput!): UpdateTagPayload!
  deleteTag(input: DeleteTagInput!): DeleteTagPayload!
  createGoal(input: CreateGoalInput!): CreateGoalPayload!
  updateGoal(input: UpdateGoalInput!): UpdateGoalPayload!
  """Delete a goal; transactions assigned to it are unassigned."""
  deleteGoal(input: DeleteGoalInput!): DeleteGoalPayload!
}

input UpdateTransactionInput {
  clientMutationId: String
  id: ID!
  """Category name; a new name is added as a USER category."""
  category: String
  note: String
  excluded: Boolean
  horizon: HorizonKey
  """A Goal id; null unassigns."""
  goalId: ID
}

type UpdateTransactionPayload {
  clientMutationId: String
  transaction: Transaction!
}

input ClearTransactionOverrideInput {
  clientMutationId: String
  id: ID!
}

type ClearTransactionOverridePayload {
  clientMutationId: String
  transaction: Transaction!
}

input SetTransactionTagsInput {
  clientMutationId: String
  id: ID!
  tags: [String!]!
}

type SetTransactionTagsPayload {
  clientMutationId: String
  transaction: Transaction!
}

input UpdateTagInput {
  clientMutationId: String
  id: ID!
  name: String
  """"#rrggbb"; null clears it."""
  color: String
}

type UpdateTagPayload {
  clientMutationId: String
  tag: Tag!
}

input DeleteTagInput {
  clientMutationId: String
  id: ID!
}

type DeleteTagPayload {
  clientMutationId: String
  deletedTagId: ID!
}

input CreateGoalInput {
  clientMutationId: String
  description: String!
  amount: Money!
  startDate: Date
  endDate: Date
  interval: GoalInterval
  repetitions: Int
  rise: Money
  horizon: HorizonKey
}

type CreateGoalPayload {
  clientMutationId: String
  goal: Goal!
}

"""Any of the goal's fields; a null clears it (description and amount cannot be cleared)."""
input UpdateGoalInput {
  clientMutationId: String
  id: ID!
  description: String
  amount: Money
  startDate: Date
  endDate: Date
  interval: GoalInterval
  repetitions: Int
  rise: Money
  horizon: HorizonKey
}

type UpdateGoalPayload {
  clientMutationId: String
  goal: Goal!
}

input DeleteGoalInput {
  clientMutationId: String
  id: ID!
}

type DeleteGoalPayload {
  clientMutationId: String
  deletedGoalId: ID!
}
